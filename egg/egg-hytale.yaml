_comment: "HyFern Custom Hytale Egg"
meta:
  version: PLCN_v3
  update_url: ""
  name: Hytale
  author: hyfern
  uuid: 6dfb0986-d542-47a4-aea6-c89255926d64
  description: "Set out on an adventure built for both creation and play. Hytale blends the freedom of a sandbox with the momentum of an RPG: explore a procedurally generated world full of dungeons, secrets, and a variety of creatures, then shape it block by block."
image: ghcr.io/pelican-eggs/games:hytale
tags:
  - hytale
  - game
features:
  - steam
docker_images:
  Hytale: ghcr.io/pelican-eggs/games:hytale
file_denylist: []
startup_commands:
  Default: "java -Xms2G -Xmx6G -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:+AlwaysPreTouch -XX:+UseLargePages -XX:+UseStringDeduplication -Dterminal.jline=false -Dterminal.ansi=true -jar HytaleServer.jar --assets {{ASSETS_PATH}} --bind 0.0.0.0:{{SERVER_PORT}} --backup --backup-dir {{BACKUP_DIR}} --backup-frequency {{BACKUP_FREQUENCY}}"
config:
  files: {}
  startup:
    done: "Hytale Server Booted!"
  logs:
    custom: true
  stop: stop
scripts:
  installation:
    script: |
      #!/bin/bash
      set -e
      
      # Download Hytale downloader
      curl --output hytale-downloader.zip "https://downloader.hytale.com/hytale-downloader.zip"
      unzip -o hytale-downloader.zip
      mv hytale-downloader-linux-amd64 /mnt/server/hytale-downloader -f
      chmod +x /mnt/server/hytale-downloader
      
      # Run downloader to get server files
      cd /mnt/server
      if [ -f "HytaleServer.jar" ]; then
          echo "Server files already exist, skipping download"
      else
          ./hytale-downloader
      fi
      
      # Create backup directory
      mkdir -p /mnt/server/Backups
      
      # Copy default plugin configs if not exists
      if [ -d "/mnt/server/mods" ]; then
          # WebServer plugin config
          if [ -f "/mnt/server/mods/WebServer/config.json" ]; then
              echo "WebServer config already exists"
          else
              mkdir -p /mnt/server/mods/WebServer
              cat > /mnt/server/mods/WebServer/config.json << 'WEBSERVER_EOF'
      {
        "port": 5523,
        "tls": {
          "enabled": true,
          "certFile": "server.crt",
          "keyFile": "server.key",
          "allowSelfSigned": true
        },
        "cors": {
          "enabled": true,
          "allowedOrigins": ["https://hyfern.us", "https://panel.hyfern.us"]
        },
        "rateLimit": {
          "enabled": true,
          "maxRequestsPerMinute": 60
        },
        "logging": {
          "level": "INFO",
          "file": "logs/webserver.log"
        }
      }
      WEBSERVER_EOF
          fi
          
          # Performance Saver plugin config
          if [ -f "/mnt/server/mods/PerformanceSaver/config.json" ]; then
              echo "PerformanceSaver config already exists"
          else
              mkdir -p /mnt/server/mods/PerformanceSaver
              cat > /mnt/server/mods/PerformanceSaver/config.json << 'PERF_EOF'
      {
        "enabled": true,
        "minViewDistance": 6,
        "maxViewDistance": 32,
        "tpsThreshold": 25,
        "checkInterval": 5,
        "adjustmentStep": 2,
        "logging": {
          "level": "INFO",
          "logAdjustments": true
        }
      }
      PERF_EOF
          fi
      fi
      
      # Copy AOT file if exists in mount
      if [ -f "/mnt/server/hytale-aot/HytaleServer.aot" ]; then
          cp /mnt/server/hytale-aot/HytaleServer.aot /mnt/server/HytaleServer.aot
          echo "AOT cache loaded"
      else
          echo "Warning: AOT cache not found at /mnt/server/hytale-aot/HytaleServer.aot"
      fi
      
      echo "-----------------------------------------"
      echo "Installation completed..."
      echo "-----------------------------------------"
    container: ghcr.io/pelican-eggs/installers:debian
    entrypoint: bash
variables:
  - sort: 6
    name: "Assets Path"
    description: "This will tell Hytale where to search for the assets"
    env_variable: ASSETS_PATH
    default_value: Assets.zip
    user_viewable: true
    user_editable: true
    rules:
      - required
      - string
  - sort: 1
    name: "Auto update"
    description: "This will enable autoupdate for the game."
    env_variable: AUTO_UPDATE
    default_value: "1"
    user_viewable: true
    user_editable: true
    rules:
      - boolean
  - sort: 5
    name: "Backup Dir"
    description: "The directory where it will save the backups."
    env_variable: BACKUP_DIR
    default_value: Backups
    user_viewable: true
    user_editable: true
    rules:
      - required
      - string
  - sort: 4
    name: "Backup Frequency"
    description: "Backup interval in minutes"
    env_variable: BACKUP_FREQUENCY
    default_value: "30"
    user_viewable: true
    user_editable: true
    rules:
      - integer
      - required
  - sort: 2
    name: Patchline
    description: ""
    env_variable: PATCHLINE
    default_value: release
    user_viewable: true
    user_editable: true
    rules:
      - required
      - "in:release,pre-release"
  - sort: 3
    name: "Install Performance Saver Plugin"
    description: "Enables the Hytale Performance Saver Plugin to optimize server performance."
    env_variable: PSAVER
    default_value: "0"
    user_viewable: true
    user_editable: true
    rules:
      - boolean
  - sort: 7
    name: "JVM Memory (Min)"
    description: "Minimum heap size for the JVM"
    env_variable: JVM_MIN_MEMORY
    default_value: 2G
    user_viewable: true
    user_editable: true
  - sort: 8
    name: "JVM Memory (Max)"
    description: "Maximum heap size for the JVM (recommended: 6G for server)"
    env_variable: JVM_MAX_MEMORY
    default_value: 6G
    user_viewable: true
    user_editable: true
  - sort: 9
    name: "AOT Cache Path"
    description: "Path to the AOT cache file for faster startup"
    env_variable: AOT_CACHE_PATH
    default_value: /mnt/server/hytale-aot/HytaleServer.aot
    user_viewable: true
    user_editable: false
