global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'hyfern'
    environment: 'production'

scrape_configs:
  - job_name: 'hytale'
    metrics_path: '/ApexHosting/PrometheusExporter/metrics'
    scheme: http
    basic_auth:
      username: 'prometheus'
      # Password loaded from environment variable at container runtime
      password: '${PROMETHEUS_PASSWORD}'
    static_configs:
      - targets: ['host.docker.internal:5523']
        labels:
          instance: 'hyfern-main'
          server_type: 'hytale'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
