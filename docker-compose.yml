services:
  caddy:
    image: caddy:2-alpine
    container_name: hyfern-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    networks:
      - public
      - internal
    depends_on:
      hyfern-frontend:
        condition: service_healthy
      pelican-panel:
        condition: service_started
      grafana:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:2019/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 256m
    cpu_shares: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  pelican-panel:
    image: ghcr.io/pelican-dev/panel:latest
    container_name: hyfern-pelican-panel
    restart: unless-stopped
    environment:
      APP_URL: ${PELICAN_APP_URL}
      APP_ENV: production
      APP_DEBUG: false
      APP_KEY: ${PELICAN_APP_KEY}
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MAIL_DRIVER: ${MAIL_DRIVER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@hyfern.us}
    volumes:
      - ./data/pelican-panel:/app/var
      - ./data/pelican-database:/var/www/html/database
      - ./pelican-Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - internal
    depends_on:
      init-permissions:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: 512m
    cpu_shares: 1024
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  wings:
    image: ghcr.io/pelican-dev/wings:latest
    container_name: hyfern-wings
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      WINGS_UID: 988
      WINGS_GID: 988
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_CONTAINERS_PATH:-/var/lib/docker/containers}:/var/lib/docker/containers:ro
      - ./data/wings:/var/lib/pelican
      - ./data/hytale:/mnt/server/hytale-aot:ro
      - /tmp/pelican:/tmp/pelican
    networks:
      - internal
    depends_on:
      - pelican-panel
    mem_limit: 256m
    cpu_shares: 512
    # Note: Cannot drop all caps - Docker socket requires privileges
    security_opt:
      - no-new-privileges:true

  hyfern-frontend:
    image: redpandamc/hyfern-frontend:latest
    container_name: hyfern-frontend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/frontend-uploads:/app/public/uploads
      - ./data/hyfern.db:/app/prisma/hyfern.db
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/prisma/hyfern.db
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      WINGS_API_URL: http://wings:8443
      WINGS_API_KEY: ${WINGS_API_KEY}
      WINGS_SERVER_UUID: ${WINGS_SERVER_UUID:-default}
      PELICAN_API_URL: http://pelican-panel:80
      PELICAN_API_KEY: ${PELICAN_API_KEY}
      PELICAN_SERVER_UUID: ${PELICAN_SERVER_UUID:-default}
      HYTALE_WEBSERVER_URL: ${HYTALE_WEBSERVER_URL:-http://host.docker.internal:5523}
      HYTALE_WEBSERVER_USERNAME: ${HYTALE_WEBSERVER_USERNAME:-hyfern}
      HYTALE_WEBSERVER_PASSWORD: ${HYTALE_WEBSERVER_PASSWORD}
      CURSEFORGE_API_KEY: ${CURSEFORGE_API_KEY}
      INIT_ADMIN_USERNAME: ${INIT_ADMIN_USERNAME:-admin}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD:-admin123}
      SERVER_ACCESS_PASSWORD: ${SERVER_ACCESS_PASSWORD}
      NEXT_PUBLIC_SERVER_ADDRESS: ${NEXT_PUBLIC_SERVER_ADDRESS:-hyfern.us}
      NEXT_PUBLIC_GRAFANA_URL: ${GRAFANA_ROOT_URL}
      NEXT_PUBLIC_PANEL_URL: ${PELICAN_APP_URL}
      PROMETHEUS_URL: http://prometheus:9090
      PROMETHEUS_JOB: hytale
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 512m
    cpu_shares: 1024
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /app/.next/cache:size=100m,noexec,nosuid

  redis:
    image: redis:7-alpine
    container_name: hyfern-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - ./data/redis:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpu_shares: 256

  # One-shot init container to fix data directory ownership
  init-permissions:
    image: alpine:3
    container_name: hyfern-init-permissions
    restart: "no"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mkdir -p /data/grafana /data/prometheus /data/frontend-uploads/avatars /data/pelican-database /data/hytale /data/wings /data/redis /data/caddy/data /data/caddy/config
        touch /data/hyfern.db
        chown 472:472 /data/grafana
        chown 65534:65534 /data/prometheus
        chown 1001:1001 /data/frontend-uploads /data/frontend-uploads/avatars /data/hyfern.db /data/hytale
        chmod 664 /data/hyfern.db
        chown 33:33 /data/pelican-database
        # Wings server files
        chown 988:988 /data/wings || true
    volumes:
      - ./data:/data

  prometheus:
    image: prom/prometheus:latest
    container_name: hyfern-prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PROMETHEUS_PASSWORD=${PROMETHEUS_PASSWORD}
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--config.file=/etc/prometheus/prometheus.yml'
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    networks:
      - internal
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 512m
    cpu_shares: 512

  grafana:
    image: grafana/grafana-oss:latest
    container_name: hyfern-grafana
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}
    volumes:
      - ./observability/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./data/grafana:/var/lib/grafana
    networks:
      - internal
    depends_on:
      init-permissions:
        condition: service_completed_successfully
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 256m
    cpu_shares: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  public:
    driver: bridge
  internal:
    driver: bridge
