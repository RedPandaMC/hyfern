services:
  caddy:
    image: caddy:2-alpine
    container_name: hyfern-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
      - ./data/caddy/locks:/locks
    networks:
      - public
      - internal
    depends_on:
      hyfern-frontend:
        condition: service_healthy
      pelican-panel:
        condition: service_healthy
      grafana:
        condition: service_started
    mem_limit: 256m
    cpu_shares: 512

  pelican-panel:
    image: ghcr.io/pelican-dev/panel:latest
    container_name: hyfern-pelican-panel
    restart: unless-stopped
    environment:
      APP_URL: ${PELICAN_APP_URL}
      APP_ENV: production
      APP_DEBUG: false
      APP_KEY: ${PELICAN_APP_KEY}
      LE_EMAIL: ${LETSENCRYPT_EMAIL}
      TRUSTED_PROXIES: "*"
      BEHIND_PROXY: "true"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MAIL_DRIVER: ${MAIL_DRIVER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@hyfern.us}
      PELICAN_ADMIN_EMAIL: hyfern-admin@hyfern.us
    volumes:
      - ./data/pelican-panel:/app/var
      - ./data/pelican-database:/var/www/html/database
      - ./pelican-Caddyfile:/etc/caddy/Caddyfile:ro
      - ./scripts/setup-pelican.sh:/usr/local/bin/setup-pelican.sh:ro
    networks:
      - internal
    depends_on:
      hyfern-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # Override entrypoint to run setup before starting services
    entrypoint:
      - /bin/ash
      - -c
      - |
        # Run setup script first if panel is not configured
        if [ ! -f /pelican-data/.env ] || ! grep -q 'APP_INSTALLED=true' /pelican-data/.env 2>/dev/null; then
          echo 'Running Pelican setup...'
          sh /usr/local/bin/setup-pelican.sh || echo 'Setup script failed, continuing...'
        fi
        
        # Start the panel using sh and pass supervisord command
        # The entrypoint.sh ends with 'exec "$@"' which needs the CMD
        echo 'Starting Pelican Panel...'
        sh /entrypoint.sh supervisord -n -c /etc/supervisord.conf
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10
    mem_limit: 512m
    cpu_shares: 1024

  wings:
    image: ghcr.io/pelican-dev/wings:latest
    container_name: hyfern-wings
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      WINGS_UID: 988
      WINGS_GID: 988
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_CONTAINERS_PATH:-/var/lib/docker/containers}:/var/lib/docker/containers:ro
      - ./data/wings:/var/lib/pelican
      - ./data/wings-config:/etc/pelican
      - ./data/hytale:/mnt/server/hytale-aot:ro
      - /tmp/pelican:/tmp/pelican
    networks:
      - internal
    depends_on:
      pelican-panel:
        condition: service_healthy
    mem_limit: 256m
    cpu_shares: 512

  hyfern-frontend:
    image: redpandamc/hyfern-frontend:latest
    container_name: hyfern-frontend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/frontend-uploads:/app/public/uploads
      - ./data/database:/app/prisma
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/prisma/hyfern.db
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      WINGS_API_URL: http://wings:8443
      WINGS_API_KEY: ${WINGS_API_KEY}
      WINGS_SERVER_UUID: ${WINGS_SERVER_UUID:-default}
      PELICAN_API_URL: http://pelican-panel:80
      PELICAN_API_KEY: ${PELICAN_API_KEY}
      PELICAN_SERVER_UUID: ${PELICAN_SERVER_UUID:-default}
      HYTALE_WEBSERVER_URL: ${HYTALE_WEBSERVER_URL:-http://host.docker.internal:5523}
      HYTALE_WEBSERVER_USERNAME: ${HYTALE_WEBSERVER_USERNAME:-hyfern}
      HYTALE_WEBSERVER_PASSWORD: ${HYTALE_WEBSERVER_PASSWORD}
      CURSEFORGE_API_KEY: ${CURSEFORGE_API_KEY}
      INIT_ADMIN_USERNAME: ${INIT_ADMIN_USERNAME:-admin}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD:-admin123}
      SERVER_ACCESS_PASSWORD: ${SERVER_ACCESS_PASSWORD}
      NEXT_PUBLIC_SERVER_ADDRESS: ${NEXT_PUBLIC_SERVER_ADDRESS:-hyfern.us}
      NEXT_PUBLIC_GRAFANA_URL: ${GRAFANA_ROOT_URL}
      NEXT_PUBLIC_PANEL_URL: ${PELICAN_APP_URL}
      PROMETHEUS_URL: http://prometheus:9090
      PROMETHEUS_JOB: hytale
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    depends_on:
      hyfern-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: 512m
    cpu_shares: 1024
    tmpfs:
      - /app/.next/cache:size=100m,noexec,nosuid

  redis:
    image: redis:7-alpine
    container_name: hyfern-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru --protected-mode yes
    volumes:
      - ./data/redis:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpu_shares: 256

  # Unified initialization container
  hyfern-init:
    image: alpine:3
    container_name: hyfern-init
    restart: "no"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "=========================================="
        echo "HyFern Unified Initialization"
        echo "=========================================="
        
        # Create all directories
        echo "[1/4] Creating directories..."
        mkdir -p /data/grafana /data/prometheus /data/frontend-uploads/avatars /data/database /data/pelican-database /data/pelican-panel /data/hytale /data/wings /data/wings-config /data/redis /data/caddy/data /data/caddy/config /data/caddy/locks
        echo "✓ Directories created"
        
        # Set ownerships
        echo "[2/4] Setting ownerships..."
        chown 472:472 /data/grafana
        chown 65534:65534 /data/prometheus
        chown 1001:1001 /data/frontend-uploads /data/frontend-uploads/avatars /data/database /data/hytale
        chown 33:33 /data/pelican-database /data/pelican-panel
        chown 988:988 /data/wings /data/wings-config 2>/dev/null || true
        chmod 755 /data/grafana /data/prometheus /data/frontend-uploads /data/database /data/pelican-database /data/hytale /data/wings /data/wings-config /data/redis /data/caddy
        echo "✓ Ownerships set"
        
        # Initialize HyFern database
        echo "[3/4] Initializing HyFern database..."
        if [ ! -f "/data/database/hyfern.db" ]; then
          touch /data/database/hyfern.db
          chown 1001:1001 /data/database/hyfern.db
          chmod 664 /data/database/hyfern.db
          echo "✓ Database created"
        else
          chown 1001:1001 /data/database/hyfern.db 2>/dev/null || true
          chmod 664 /data/database/hyfern.db 2>/dev/null || true
          echo "✓ Database exists"
        fi
        
        # Initialize Pelican database
        echo "[4/4] Initializing Pelican database..."
        if [ ! -f "/data/pelican-database/database.sqlite" ]; then
          apk add --no-cache sqlite 2>/dev/null
          sqlite3 /data/pelican-database/database.sqlite "VACUUM;"
          chown 33:33 /data/pelican-database/database.sqlite
          chmod 664 /data/pelican-database/database.sqlite
          echo "✓ Pelican database created"
        else
          chown 33:33 /data/pelican-database/database.sqlite 2>/dev/null || true
          chmod 664 /data/pelican-database/database.sqlite 2>/dev/null || true
          echo "✓ Pelican database exists"
        fi
        
        echo ""
        echo "=========================================="
        echo "Initialization Complete!"
        echo "=========================================="
        echo ""
        echo "Services will auto-configure on startup:"
        echo "  - Pelican Panel: Will auto-run migrations"
        echo "  - Grafana: Admin user will be created"
        echo ""
    volumes:
      - ./data:/data

  prometheus:
    image: prom/prometheus:latest
    container_name: hyfern-prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PROMETHEUS_PASSWORD=${PROMETHEUS_PASSWORD}
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    networks:
      - internal
    depends_on:
      hyfern-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 512m
    cpu_shares: 512

  grafana:
    image: grafana/grafana-oss:latest
    container_name: hyfern-grafana
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}
      GF_SECURITY_ADMIN_USER: hyfern-admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-hyfern123}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
    volumes:
      - ./observability/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./data/grafana:/var/lib/grafana
    networks:
      - internal
    depends_on:
      hyfern-init:
        condition: service_completed_successfully
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 256m
    cpu_shares: 512

networks:
  public:
    driver: bridge
  internal:
    driver: bridge
