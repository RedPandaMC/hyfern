services:
  caddy:
    image: caddy:2-alpine
    container_name: hyfern-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
      - ./data/caddy/locks:/locks
    networks:
      - public
      - internal
    depends_on:
      hyfern-frontend:
        condition: service_healthy
      grafana:
        condition: service_started
    mem_limit: 256m
    cpu_shares: 512

  hyfern-frontend:
    image: redpandamc/hyfern-frontend:latest
    container_name: hyfern-frontend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/frontend-uploads:/app/public/uploads
      - ./data/database:/app/prisma
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/prisma/hyfern.db
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      HYTALE_WEBSERVER_URL: http://hytale-server:5523
      HYTALE_WEBSERVER_USERNAME: ${HYTALE_WEBSERVER_USERNAME:-hyfern}
      HYTALE_WEBSERVER_PASSWORD: ${HYTALE_WEBSERVER_PASSWORD}
      CURSEFORGE_API_KEY: ${CURSEFORGE_API_KEY}
      INIT_ADMIN_USERNAME: ${INIT_ADMIN_USERNAME:-admin}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD:-admin123}
      SERVER_ACCESS_PASSWORD: ${SERVER_ACCESS_PASSWORD}
      NEXT_PUBLIC_SERVER_ADDRESS: ${NEXT_PUBLIC_SERVER_ADDRESS:-hyfern.us}
      NEXT_PUBLIC_GRAFANA_URL: ${GRAFANA_ROOT_URL}
      PROMETHEUS_URL: http://prometheus:9090
      PROMETHEUS_JOB: hytale
      DOCKER_HOST: unix:///var/run/docker.sock
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 512m
    cpu_shares: 1024
    tmpfs:
      - /app/.next/cache:size=100m,noexec,nosuid
    privileged: true

  hytale-server:
    image: eclipse-temurin:25-jre
    container_name: hyfern-hytale
    restart: unless-stopped
    ports:
      - "5520:5520/udp"
    volumes:
      - ./data/hytale:/data
    working_dir: /data
    command: >
      java
      -Xms${HYTALE_MEMORY:-4G}
      -Xmx${HYTALE_MAX_MEMORY:-6G}
      -XX:+Use${HYTALE_GC:-G1GC}
      -XX:MaxGCPauseMillis=${HYTALE_MAX_GC_PAUSE:-200}
      -XX:AOTCache=HytaleServer.aot
      ${HYTALE_CUSTOM_JVM_FLAGS:-}
      -jar HytaleServer.jar
      --assets Assets.zip
    environment:
      TZ: UTC
      HYTALE_MEMORY: ${HYTALE_MEMORY:-4G}
      HYTALE_MAX_MEMORY: ${HYTALE_MAX_MEMORY:-6G}
      HYTALE_GC: ${HYTALE_GC:-G1GC}
      HYTALE_MAX_GC_PAUSE: ${HYTALE_MAX_GC_PAUSE:-200}
      HYTALE_CUSTOM_JVM_FLAGS: ${HYTALE_CUSTOM_JVM_FLAGS:-}
    env_file:
      - .env
    networks:
      - internal
    mem_limit: 8g
    cpu_shares: 2048

  redis:
    image: redis:7-alpine
    container_name: hyfern-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru --protected-mode yes
    volumes:
      - ./data/redis:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpu_shares: 256

  hyfern-init:
    image: alpine:3
    container_name: hyfern-init
    restart: "no"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        echo "=========================================="
        echo "HyFern Initialization"
        echo "=========================================="
        
        # Create all directories
        echo "[1/4] Creating directories..."
        mkdir -p /data/grafana /data/prometheus /data/frontend-uploads/avatars /data/database /data/hytale/config /data/redis /data/caddy/data /data/caddy/config /data/caddy/locks
        echo "Directories created"
        
        # Set ownerships
        echo "[2/4] Setting ownerships..."
        chown 472:472 /data/grafana
        chown 65534:65534 /data/prometheus
        chown -R 1001:1001 /data/frontend-uploads /data/database /data/hytale
        chmod 755 /data/grafana /data/prometheus /data/frontend-uploads /data/database /data/hytale /data/redis /data/caddy
        echo "Ownerships set"
        
        # Initialize HyFern database
        echo "[3/4] Initializing HyFern database..."
        if [ ! -f "/data/database/hyfern.db" ]; then
          touch /data/database/hyfern.db
          chown 1001:1001 /data/database/hyfern.db
          chmod 664 /data/database/hyfern.db
          echo "Database created"
        else
          chown 1001:1001 /data/database/hyfern.db
          chmod 664 /data/database/hyfern.db
          echo "Database exists"
        fi
        
        # Create Hytale config if not exists
        echo "[4/4] Initializing Hytale config..."
        if [ ! -f "/data/hytale/config/config.json" ]; then
          printf '{"ServerName": "HyFern Server", "MOTD": "Welcome to HyFern!", "MaxPlayers": 100, "MaxViewRadius": 32, "viewDistance": 16, "Password": ""}' > /data/hytale/config/config.json
          chown 1001:1001 /data/hytale/config/config.json
          echo "Config created"
        else
          echo "Config exists"
        fi
        
        echo ""
        echo "=========================================="
        echo "Initialization Complete!"
        echo "=========================================="
    volumes:
      - ./data:/data

  prometheus:
    image: prom/prometheus:latest
    container_name: hyfern-prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PROMETHEUS_PASSWORD=${PROMETHEUS_PASSWORD}
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    networks:
      - internal
    depends_on:
      hyfern-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 512m
    cpu_shares: 512

  grafana:
    image: grafana/grafana-oss:latest
    container_name: hyfern-grafana
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}
      GF_SECURITY_ADMIN_USER: hyfern-admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-hyfern123}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
    volumes:
      - ./observability/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./data/grafana:/var/lib/grafana
    networks:
      - internal
    depends_on:
      hyfern-init:
        condition: service_completed_successfully
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 256m
    cpu_shares: 512

networks:
  public:
    driver: bridge
  internal:
    driver: bridge
