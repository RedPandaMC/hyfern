services:
  caddy:
    image: caddy:2-alpine
    container_name: hyfern-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
      - ./data/caddy/locks:/locks
    networks:
      - public
      - internal
    depends_on:
      hyfern-frontend:
        condition: service_healthy
      pterodactyl-panel:
        condition: service_healthy
      grafana:
        condition: service_started
    mem_limit: 256m
    cpu_shares: 512

  # Pterodactyl Panel - replaces Pelican
  pterodactyl-panel:
    build:
      context: ./pterodactyl
      dockerfile: Dockerfile
    container_name: hyfern-pterodactyl-panel
    restart: unless-stopped
    environment:
      APP_URL: ${PTERODACTYL_APP_URL:-https://panel.hyfern.us}
      APP_KEY: ${PTERODACTYL_APP_KEY}
      APP_ENV: production
      APP_DEBUG: "false"
      
      # Database - MariaDB
      DB_HOST: pterodactyl-db
      DB_PORT: 3306
      DB_DATABASE: pterodactyl
      DB_USERNAME: pterodactyl
      DB_PASSWORD: ${PTERODACTYL_DB_PASSWORD}
      DB_SSL_MODE: "prefer"
      LARAVEL_LOAD_SKIP_SSL: "true"
      
      # Redis (reuse existing)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_DRIVER: redis
      
      # Mail settings
      MAIL_DRIVER: log
      MAIL_FROM_ADDRESS: noreply@hyfern.us
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-HyFern}"
      
      # Additional settings
      APP_TIMEZONE: UTC
    volumes:
      - ./data/pterodactyl:/var/www/pterodactyl/storage
      - ./config/pterodactyl:/var/www/pterodactyl/config
    networks:
      - internal
    depends_on:
      hyfern-init:
        condition: service_completed_successfully
      pterodactyl-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 10
    mem_limit: 512m
    cpu_shares: 1024

  # Pterodactyl Wings - runs game servers
  pterodactyl-wings:
    image: ghcr.io/pterodactyl/wings:latest
    container_name: hyfern-pterodactyl-wings
    restart: unless-stopped
    ports:
      - "8443:8443"
      - "8080:8080"
    environment:
      TZ: ${TZ:-UTC}
      WINGS_UID: 988
      WINGS_GID: 988
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_CONTAINERS_PATH:-/var/lib/docker/containers}:/var/lib/docker/containers:ro
      - ./data/pterodactyl-wings/var/lib/pterodactyl:/var/lib/pterodactyl
      - ./data/pterodactyl-wings/etc/pterodactyl:/etc/pterodactyl
      - ./data/hytale:/mnt/server/hytale-aot:ro
    networks:
      - internal
    depends_on:
      pterodactyl-panel:
        condition: service_healthy
      pterodactyl-db:
        condition: service_healthy
    mem_limit: 256m
    cpu_shares: 512
    privileged: true

  # MariaDB Database for Pterodactyl
  pterodactyl-db:
    image: mariadb:10.6
    container_name: hyfern-pterodactyl-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: pterodactyl
      MYSQL_USER: pterodactyl
      MYSQL_PASSWORD: ${PTERODACTYL_DB_PASSWORD}
    volumes:
      - ./data/pterodactyl-db:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpu_shares: 512

  hyfern-frontend:
    image: redpandamc/hyfern-frontend:latest
    container_name: hyfern-frontend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/frontend-uploads:/app/public/uploads
      - ./data/database:/app/prisma
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/prisma/hyfern.db
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      
      # Pterodactyl API (replaces Pelican)
      PTERODACTYL_API_URL: http://pterodactyl-panel:80
      PTERODACTYL_API_KEY: ${PTERODACTYL_API_KEY}
      
      # Hytale Webserver
      HYTALE_WEBSERVER_URL: ${HYTALE_WEBSERVER_URL:-http://host.docker.internal:5523}
      HYTALE_WEBSERVER_USERNAME: ${HYTALE_WEBSERVER_USERNAME:-hyfern}
      HYTALE_WEBSERVER_PASSWORD: ${HYTALE_WEBSERVER_PASSWORD}
      CURSEFORGE_API_KEY: ${CURSEFORGE_API_KEY}
      
      # Admin setup
      INIT_ADMIN_USERNAME: ${INIT_ADMIN_USERNAME:-admin}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD:-admin123}
      SERVER_ACCESS_PASSWORD: ${SERVER_ACCESS_PASSWORD}
      
      # Public URLs
      NEXT_PUBLIC_SERVER_ADDRESS: ${NEXT_PUBLIC_SERVER_ADDRESS:-hyfern.us}
      NEXT_PUBLIC_GRAFANA_URL: ${GRAFANA_ROOT_URL}
      NEXT_PUBLIC_PANEL_URL: ${PTERODACTYL_APP_URL:-https://panel.hyfern.us}
      
      # Prometheus
      PROMETHEUS_URL: http://prometheus:9090
      PROMETHEUS_JOB: hytale
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    depends_on:
      hyfern-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: 512m
    cpu_shares: 1024
    tmpfs:
      - /app/.next/cache:size=100m,noexec,nosuid

  redis:
    image: redis:7-alpine
    container_name: hyfern-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru --protected-mode yes
    volumes:
      - ./data/redis:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpu_shares: 256

  # Unified initialization container
  hyfern-init:
    image: alpine:3
    container_name: hyfern-init
    restart: "no"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "=========================================="
        echo "HyFern Unified Initialization"
        echo "=========================================="
        
        # Create all directories
        echo "[1/5] Creating directories..."
        mkdir -p /data/grafana /data/prometheus /data/frontend-uploads/avatars /data/database /data/pterodactyl /data/pterodactyl-db /data/pterodactyl-wings /data/pterodactyl-wings-config /data/hytale /data/redis /data/caddy/data /data/caddy/config /data/caddy/locks
        echo "✓ Directories created"
        
        # Set ownerships
        echo "[2/5] Setting ownerships..."
        chown 472:472 /data/grafana
        chown 65534:65534 /data/prometheus
        chown 1001:1001 /data/frontend-uploads /data/frontend-uploads/avatars /data/database /data/hytale
        chown 999:999 /data/pterodactyl-db 2>/dev/null || true
        chown 988:988 /data/pterodactyl-wings /data/pterodactyl-wings-config 2>/dev/null || true
        chmod 755 /data/grafana /data/prometheus /data/frontend-uploads /data/database /data/pterodactyl /data/pterodactyl-db /data/hytale /data/pterodactyl-wings /data/pterodactyl-wings-config /data/redis /data/caddy
        echo "✓ Ownerships set"
        
        # Initialize HyFern database (frontend)
        echo "[3/5] Initializing HyFern database..."
        if [ ! -f "/data/database/hyfern.db" ]; then
          touch /data/database/hyfern.db
          chown 1001:1001 /data/database/hyfern.db
          chmod 664 /data/database/hyfern.db
          echo "✓ Database created"
        else
          chown 1001:1001 /data/database/hyfern.db 2>/dev/null || true
          chmod 664 /data/database/hyfern.db 2>/dev/null || true
          echo "✓ Database exists"
        fi
        
        # Create Pterodactyl storage directory
        echo "[4/5] Initializing Pterodactyl storage..."
        if [ ! -d "/data/pterodactyl/storage" ]; then
          mkdir -p /data/pterodactyl/storage
          chown 1000:1000 /data/pterodactyl/storage 2>/dev/null || true
          echo "✓ Storage created"
        else
          echo "✓ Storage exists"
        fi
        
        # Create Wings directories
        echo "[5/5] Initializing Wings directories..."
        if [ ! -d "/data/pterodactyl-wings/var/lib/pterodactyl" ]; then
          mkdir -p /data/pterodactyl-wings/var/lib/pterodactyl /data/pterodactyl-wings/etc/pterodactyl
          chown 988:988 /data/pterodactyl-wings/var/lib/pterodactyl /data/pterodactyl-wings/etc/pterodactyl 2>/dev/null || true
          echo "✓ Wings directories created"
        else
          echo "✓ Wings directories exist"
        fi
        
        echo ""
        echo "=========================================="
        echo "Initialization Complete!"
        echo "=========================================="
        echo ""
        echo "Services will auto-configure on startup:"
        echo "  - Pterodactyl Panel: Will initialize on first run"
        echo "  - Grafana: Admin user will be created"
        echo ""
    volumes:
      - ./data:/data

  prometheus:
    image: prom/prometheus:latest
    container_name: hyfern-prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PROMETHEUS_PASSWORD=${PROMETHEUS_PASSWORD}
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    networks:
      - internal
    depends_on:
      hyfern-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 512m
    cpu_shares: 512

  grafana:
    image: grafana/grafana-oss:latest
    container_name: hyfern-grafana
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}
      GF_SECURITY_ADMIN_USER: hyfern-admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-hyfern123}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
    volumes:
      - ./observability/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./data/grafana:/var/lib/grafana
    networks:
      - internal
    depends_on:
      hyfern-init:
        condition: service_completed_successfully
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 256m
    cpu_shares: 512

networks:
  public:
    driver: bridge
  internal:
    driver: bridge
